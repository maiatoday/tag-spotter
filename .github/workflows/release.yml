name: Release and Bump Version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout project source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump Version
        id: bump_version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: |
          python3 -c '
          import re, sys, os
          bump_type = os.environ.get("BUMP_TYPE", "patch")
          filepath = "app/build.gradle.kts"
          
          with open(filepath, "r") as f:
              content = f.read()
          
          # Find versionCode
          vc_match = re.search(r"versionCode\s*=\s*(\d+)", content)
          if not vc_match:
              print("Could not find versionCode in build.gradle.kts")
              sys.exit(1)
          current_vc = int(vc_match.group(1))
          new_vc = current_vc + 1
          
          # Find versionName
          vn_match = re.search(r"versionName\s*=\s*\"([^\"]+)\"", content)
          if not vn_match:
              print("Could not find versionName in build.gradle.kts")
              sys.exit(1)
          current_vn = vn_match.group(1)
          
          # Parse versionName
          parts = current_vn.split(".")
          while len(parts) < 3:
              parts.append("0")
              
          try:
              major, minor, patch = map(int, parts[:3])
          except ValueError:
              print(f"Invalid versionName format: {current_vn}")
              sys.exit(1)
              
          if bump_type == "major":
              major += 1
              minor = 0
              patch = 0
          elif bump_type == "minor":
              minor += 1
              patch = 0
          else:
              patch += 1
              
          new_vn = f"{major}.{minor}.{patch}"
          
          content = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {new_vc}", content)
          content = re.sub(r"versionName\s*=\s*\"[^\"]+\"", f"versionName = \"{new_vn}\"", content)
          
          with open(filepath, "w") as f:
              f.write(content)
              
          print(f"Bumped version: {current_vn} (code {current_vc}) -> {new_vn} (code {new_vc})")
          
          if "GITHUB_OUTPUT" in os.environ:
              with open(os.environ["GITHUB_OUTPUT"], "a") as go:
                  go.write(f"new_version={new_vn}\n")
          '

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Bump version to v${{ steps.bump_version.outputs.new_version }}"
          git push origin HEAD

      - name: Create and push Tag
        run: |
          git tag "v${{ steps.bump_version.outputs.new_version }}"
          git push origin "v${{ steps.bump_version.outputs.new_version }}"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          gh release create "v${{ steps.bump_version.outputs.new_version }}" "$APK_PATH" \
            --title "Release v${{ steps.bump_version.outputs.new_version }}" \
            --notes "Automated release of version v${{ steps.bump_version.outputs.new_version }}."
