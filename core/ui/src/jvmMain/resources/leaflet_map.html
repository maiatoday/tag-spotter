<!DOCTYPE html>
<html>
<head>
    <title>Leaflet Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        /* Light/Dark mode basic support */
        @media (prefers-color-scheme: dark) {
            body { background: #121212; }
            .leaflet-tile { filter: brightness(0.8) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7); }
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map', {
            zoomControl: false // Optional: manage zoom via compose if needed
        }).setView([0, 0], 2);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        var markers = [];

        function setMapCenter(lat, lng, zoom) {
            map.setView([lat, lng], zoom);
        }

        function clearMarkers() {
            for(var i = 0; i < markers.length; i++) {
                map.removeLayer(markers[i]);
            }
            markers = [];
        }

        function addMarker(lat, lng) {
            var marker = L.marker([lat, lng]).addTo(map);
            markers.push(marker);
        }

        function setDarkMap(isDark) {
            var tiles = document.getElementsByClassName('leaflet-tile');
            for(var i = 0; i < tiles.length; i++) {
                if (isDark) {
                    tiles[i].style.filter = "brightness(0.8) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7)";
                } else {
                    tiles[i].style.filter = "none";
                }
            }
        }

        // Bridge to Kotlin
        map.on('click', function(e) {
            if (typeof app !== 'undefined') {
                app.onMapClick(e.latlng.lat, e.latlng.lng);
            }
        });

        // Notify ready
        window.onload = function() {
            if (typeof app !== 'undefined') {
                app.onMapReady();
            }
        };
    </script>
</body>
</html>
